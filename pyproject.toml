[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gm-billing"
version = "0.1.0"
description = "GoodMorning usage metering and billing ledger"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.7,<3"]

[tool.setuptools.packages.find]
include = ["gm_billing*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
